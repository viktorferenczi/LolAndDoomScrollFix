# Windowsos végpontok közötti próba: csendes telepítés, admin jelszó, admin felület (UI Automation), eltávolítás.
# Kézzel indítható, vagy a `ci/e2e` ágra küldéskor fut. A képernyőképek és naplók a futás „Artifacts” részében érhetők el.
name: Windowsos végpontok közötti próba

on:
  push:
    branches: ['ci/e2e']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Inno Setup telepítése
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Fordítás (tesztek nélkül; azok a fő CI-ban futnak)
        shell: pwsh
        run: ./installer/build.ps1 -SkipTests

      - name: Végpontok közötti próba
        shell: pwsh
        run: ./tools/e2e-windows.ps1

      - name: Bizonyítékok feltöltése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bizonyitekok
          path: out/e2e
          if-no-files-found: warn
