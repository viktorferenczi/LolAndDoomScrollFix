# Windows end-to-end test: silent install, admin password, admin panel (UI Automation), uninstall.
# Runs once per UI language (English and Hungarian). Can be started by hand, or by pushing to the `ci/e2e` branch.
# The screenshots and logs are available under "Artifacts" of the run.
name: Windows end-to-end test

on:
  push:
    branches: ['ci/e2e']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [en, hu]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build (without tests; those run in the main CI)
        shell: pwsh
        run: ./installer/build.ps1 -SkipTests

      - name: End-to-end test (${{ matrix.language }})
        shell: pwsh
        run: ./tools/e2e-windows.ps1 -Language ${{ matrix.language }}

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.language }}
          path: out/e2e
          if-no-files-found: warn
