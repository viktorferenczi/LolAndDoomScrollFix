# Quick check: does the Inno Setup script compile? Runs only when pushing to the `ci/installer-check` branch.
name: Installer compile check

on:
  push:
    branches: ['ci/installer-check']
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Placeholder program files (for compiling only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory out/app -Force | Out-Null
          foreach ($f in 'Limiter.Service.exe', 'Limiter.NativeHost.exe', 'Limiter.Tray.exe', 'install.ps1', 'uninstall.ps1') {
            Set-Content -Path "out/app/$f" -Value 'x'
          }

      - name: Compile
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/LolScrollLimiter.iss
          if ($LASTEXITCODE -ne 0) { throw 'Compiling the installer failed.' }
