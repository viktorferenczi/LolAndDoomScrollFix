# Kiadás: egy `vX.Y.Z` címke feltöltésekor lefordítja a telepítőt Windows alatt, és közzéteszi a GitHub-kiadások között.
# A tálcaalkalmazás „Frissítések keresése” gombja innen tölti le a legújabb telepítőt (és az ellenőrzőösszegét).
#
# Használat:
#   1. Emeld a verziót (Directory.Build.props, extension/manifest.json, installer/LolScrollLimiter.iss), commit, push.
#   2. git tag v1.4.0 && git push origin v1.4.0
name: Kiadás

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: A címke és a verzió egyezésének ellenőrzése
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.Project.PropertyGroup.Version
          if ($version -ne $tag) { throw "A címke ($tag) nem egyezik a Directory.Build.props verziójával ($version)." }
          $iss = Get-Content installer/LolScrollLimiter.iss -Raw
          if ($iss -notmatch "#define AppVersion `"$([regex]::Escape($tag))`"") { throw "Az installer verziója nem $tag." }

      - name: Inno Setup telepítése
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Tesztek, fordítás, telepítő
        shell: pwsh
        run: ./installer/build.ps1

      - name: Ellenőrzőösszegek
        shell: pwsh
        run: |
          $files = Get-ChildItem out/LolScrollLimiter-Setup-*.exe, out/extension-store.zip, out/extension-dev.zip
          $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Path out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt

      - name: Kiadás közzététele
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' `
            (Get-ChildItem out/LolScrollLimiter-Setup-*.exe).FullName `
            out/extension-store.zip out/extension-dev.zip out/SHA256SUMS.txt `
            --title '${{ github.ref_name }}' --generate-notes
