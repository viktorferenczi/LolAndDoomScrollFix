# Release: when a `vX.Y.Z` tag is pushed, builds the installer on Windows and publishes it among the GitHub releases.
# The tray application's "Check for updates" button downloads the latest installer (and its checksum) from here.
#
# Usage:
#   1. Raise the version (Directory.Build.props, extension/manifest.json, installer/LolScrollLimiter.iss), commit, push.
#   2. git tag v1.4.0 && git push origin v1.4.0
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the tag matches the version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.Project.PropertyGroup.Version
          if ($version -ne $tag) { throw "The tag ($tag) does not match the version in Directory.Build.props ($version)." }
          $iss = Get-Content installer/LolScrollLimiter.iss -Raw
          if ($iss -notmatch "#define AppVersion `"$([regex]::Escape($tag))`"") { throw "The installer version is not $tag." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Tests, build, installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem out/LolScrollLimiter-Setup-*.exe, out/extension-store.zip, out/extension-dev.zip
          $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Path out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' `
            (Get-ChildItem out/LolScrollLimiter-Setup-*.exe).FullName `
            out/extension-store.zip out/extension-dev.zip out/SHA256SUMS.txt `
            --title '${{ github.ref_name }}' --generate-notes
