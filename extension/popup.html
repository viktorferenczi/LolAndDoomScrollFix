<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="popupTitle">Limiter</title>
  <style>
    :root { color-scheme: light dark; --ok: #1a7f37; --bad: #cf222e; --muted: #6e7781; }
    body { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 300px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(127,127,127,.2); }
    .row:last-of-type { border-bottom: 0; }
    .val { font-weight: 600; text-align: right; }
    .sub { color: var(--muted); font-size: 12px; }
    .state { margin-top: 10px; font-size: 13px; }
    .state.ok { color: var(--ok); }
    .state.bad { color: var(--bad); }
  </style>
</head>
<body>
  <h1 data-i18n="extName">LoL &amp; Doomscroll Limiter</h1>
  <div class="row"><span data-i18n="lolPvp">LoL PvP</span><span class="val" id="lol">–</span></div>
  <div class="row"><span data-i18n="shortVideos">Short videos</span><span class="val" id="short">–</span></div>
  <div class="row"><span data-i18n="facebookFeed">Facebook feed</span><span class="val" id="feed">–</span></div>
  <div class="sub" id="schedule"></div>
  <div class="sub" id="incognito"></div>
  <div class="state" id="state">…</div>
  <script src="popup.js"></script>
</body>
</html>
